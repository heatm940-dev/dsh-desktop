name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artifacts without creating a GitHub release'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
            command: 'npx electron-builder --win --x64 --publish never'
            artifact_glob: 'dist/*-windows-*.exe'
          - target: mac-x64
            # macos-13 (Intel) runners queue for 1h+ on shared GH infra; an
            # arm64 runner cross-builds the x64 artifacts fine.
            os: macos-14
            command: 'node scripts/fetch-node.mjs --platform darwin --arch x64 && npx electron-builder --mac --x64 --publish never'
            artifact_glob: 'dist/*-mac-x64.*'
          - target: mac-arm64
            os: macos-14
            command: 'npx electron-builder --mac --arm64 --publish never'
            artifact_glob: 'dist/*-mac-arm64.*'

    runs-on: ${{ matrix.os }}

    # The repo .npmrc points at npmmirror for CN dev machines; GitHub runners
    # are fastest against the official registry, so override it here.
    env:
      npm_config_registry: https://registry.npmjs.org

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No package-lock.json is committed (npm is not runnable inside the
      # authoring sandbox), so use npm install instead of npm ci.
      - name: Install shell dependencies
        run: npm install --no-audit --no-fund

      # Each runner only fetches the Node runtime for its own platform/arch,
      # so every installer ships a single ~85MB runtime instead of all three.
      - name: Fetch embedded Node runtime
        run: npm run fetch:node

      - name: Install dsh runtime into resources/dsh
        shell: bash
        working-directory: resources/dsh
        run: |
          npm init -y
          npm install @deepseek-ai/dsh@0.1.0-rc.6 --omit=dev --no-audit --no-fund

      - name: Build (${{ matrix.target }})
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          # Without a Developer ID certificate, skip auto code-signing
          # discovery entirely so unsigned dmg/zip builds succeed.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Set CSC_LINK/CSC_KEY_PASSWORD as repo secrets to enable macOS signing/notarization.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.exe
            dist/**/*.zip
            dist/**/*.dmg
            dist/**/*.yml
            dist/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
